name: Domain CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-domain-suite:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run deterministic domain suite
        env:
          PYTHONPATH: backend/src
          PYTHONHASHSEED: "0"
        run: python -m unittest discover -s backend/tests -p "test_[a-r]*.py" -v

  phase-2-application-suite:
    name: Phase 2 API + UI / Python 3.14 / Node 24
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install locked backend
        run: |
          python -m pip install uv==0.13.9
          uv sync --project backend --extra dev --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend from lockfile
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Validate artifact, API, performance, and production routes
        env:
          PYTHONHASHSEED: "0"
        run: backend/.venv/bin/python -m unittest -v backend.tests.test_solution_artifact backend.tests.test_study_api

