[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerhelper"
version = "0.3.0"
description = "Local-first poker study application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio==4.9.0",
    "fastapi==0.115.12",
    "pydantic==2.14.3",
    "SQLAlchemy==2.1.9",
    "alembic==1.20.1",
    "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
]

[project.scripts]
pokerhelper = "pokerhelper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokerhelper = [
    "infrastructure/alembic/script.py.mako",
    "resources/solutions/*/manifest.json",
    "resources/solutions/*/nodes/*.json",
]

